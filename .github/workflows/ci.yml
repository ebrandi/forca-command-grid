# Lint + test on every push and pull request.
#
# The repo carries ~2,350 tests but nothing ran them on incoming changes, so a PR
# from an external contributor could not be evaluated automatically. This workflow
# is the gate: ruff for style/security lint (the `S` ruleset is enabled in
# pyproject.toml), then the full pytest suite against a real PostgreSQL, which the
# test settings require.
#
# Actions are pinned to a full commit SHA, not a tag: a tag is mutable and can be
# repointed at malicious code by a compromised maintainer account.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read           # least privilege: this job only reads the repo

concurrency:
  # A newer push to the same ref makes an in-flight run redundant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.7,<0.13"
      - name: Lint
        # `.github/scripts` is named explicitly because ruff skips dot-directories when
        # it walks `.`, so the CI helper scripts living there would otherwise be the one
        # corner of the tree with no lint gate — and they are exactly the code whose
        # silent breakage makes a security job scan less than it claims to.
        run: ruff check . .github/scripts

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forca
          POSTGRES_USER: forca
          # Throwaway credential for an ephemeral CI container that is never
          # reachable off the runner. Not a secret.
          POSTGRES_PASSWORD: forca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forca -d forca"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://forca:forca@localhost:5432/forca
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install gettext (msgfmt, for catalogue compilation)
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Django system check
        run: python manage.py check
      - name: Compile message catalogues
        # Fails the build on a malformed .po — a broken locale must never ship silently
        # (docs/i18n/design/11-catalogue-maintenance.md).
        #
        # The other two i18n gates run inside `pytest` below, so they need nothing here:
        #   * catalogue freshness — tests/test_i18n_catalogue_freshness.py re-extracts into a
        #     scratch tree and compares the (msgctxt, msgid) SET, so a string marked in the code
        #     but never extracted fails the build. Comparing identities rather than file bytes is
        #     what makes it immune to the gettext-version formatting drift that kept this gate
        #     deferred. It needs the gettext installed above.
        #   * terminology — tests/test_i18n_terminology.py lints every committed catalogue against
        #     core/i18n/data/protected-terms.yml.
        run: python manage.py compilemessages
      - name: Run tests
        run: pytest -q

  # static/css/app.css and static/js/vendor/*.js are PREBUILT artifacts, committed to the
  # repo and shipped verbatim: the production image has no Node in it and the deploy path
  # never runs Tailwind. So a template that starts using a class the committed stylesheet
  # was never compiled with gets no styling in production — silently. No error, no failing
  # test, nothing in the logs. Four days of dead styles shipped that way once.
  #
  # This job is the missing gate: rebuild from source, then refuse the change if the
  # committed bytes differ. It shares one script with `make frontend-check` so a
  # contributor can reproduce the failure (and fix it) locally with the same code path.
  frontend-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The runner's preinstalled Node is used deliberately — no setup-node step. The
      # emitted CSS is a function of the tailwindcss version, which vendors its own
      # PostCSS/cssnano toolchain, so the Node major does not move the output; skipping
      # the action keeps one less third-party dependency to pin and audit. (That also
      # rules out setup-node's dependency cache, which is a fair trade: the install is
      # ~80 packages and under a second.) The check script installs with `npm ci` from
      # the committed frontend/package-lock.json, so this job and a developer's machine
      # resolve the identical tree down to the transitive packages — which is what makes
      # a diff here mean "someone did not rebuild" and nothing else. The versions are
      # logged so that if this job ever does disagree with a developer's machine, the
      # first question is already answered.
      - name: Record the toolchain versions
        run: node --version && npm --version
      - name: Rebuild the front-end assets and diff them against the committed ones
        run: bash scripts/check-frontend-build.sh

  # Django's own deployment checklist, run against config.settings.prod with
  # throwaway-but-realistic secrets. This currently passes with zero warnings; the job
  # exists so it keeps doing so. `--fail-level WARNING` makes a new warning a red build.
  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: check --deploy against production settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: grid.example.com
          # Not secrets: generated per-run, used only to satisfy the settings module.
          # SECRET_KEY must exceed 50 chars or security.W009 fires.
          DATABASE_URL: postgres://forca:forca@localhost:5432/forca
          ESI_USER_AGENT: "forca-command-grid/ci (ci@example.invalid)"
        run: |
          export DJANGO_SECRET_KEY="$(openssl rand -base64 50 | tr -d '\n')"
          export TOKEN_ENCRYPTION_KEY="$(openssl rand -base64 32 | tr '+/' '-_')"
          python manage.py check --deploy --fail-level WARNING
