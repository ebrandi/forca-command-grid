# Declared-dependency vulnerability scan: pip-audit for Python, npm audit for JavaScript.
#
# This is the CI path for the same scan that runs weekly in-stack via Celery beat
# (admin_audit.audit_dependencies) — production deploys do NOT go through GitHub, so
# the beat job is the authoritative recurring control; this workflow gates code that
# *is* pushed to GitHub and gives a weekly second look.
#
# TWO jobs, because they answer different questions and only one of them can be trusted
# to describe what is running:
#
#   pip-audit        audits requirements.txt — INTENT. "Would a fresh install of these
#                    constraints be clean?" Cheap, catches a bad floor the moment it is
#                    proposed, and is what Dependabot's PRs are graded against.
#
#   pip-audit-image  builds the application image and audits the packages it actually
#                    ends up with — REALITY. requirements.txt carries lower bounds, so
#                    the file scan stays green while an already-built image keeps
#                    serving whatever it resolved weeks ago; it also never sees the
#                    transitive packages the file does not name, or pip itself.
#
# That second job exists because the gap is not hypothetical here: a green requirements
# scan sat next to a running container carrying 24 Pillow CVEs, for exactly this reason.
# The same gate runs on the deploy path (scripts/audit-image.sh, called by `make deploy`
# and scripts/update.sh), which is the one that protects production; this job is the
# pull-request-time copy of it.
#
#   npm-audit        audits frontend/package-lock.json. The JavaScript in this app had NO
#                    scanner of any kind until this job existed — not here, not in
#                    Dependabot — while four libraries pinned to exact versions were being
#                    served to every visitor's browser. The intent/reality split above has
#                    an exact analogue on this side: package.json is intent,
#                    static/js/vendor/*.js is what actually ships. What closes that gap is
#                    ci.yml's `frontend-assets` job, which rebuilds the vendor bundles and
#                    fails if the committed bytes differ — so auditing the lockfile is
#                    sufficient here only BECAUSE that job exists. If it is ever removed,
#                    this one starts auditing a fiction.
#
# NOT covered by any job in this file: operating-system packages. pip-audit and npm audit
# both enumerate language-ecosystem distributions, so neither can see an OpenSSL CVE in an
# alpine base layer — which is the single worst finding this project has had. That belongs
# to image-scan.yml (trivy, daily).
#
# Hardening: every `uses:` is pinned to a full commit SHA. A tag is mutable and can
# be repointed at malicious code by a compromised maintainer account.

name: security

on:
  push:
    branches: [main]
    # Dockerfile is in the filter because it decides what lands in the image (the base
    # image, the pip floor, the apt packages) — a change there can introduce a
    # vulnerable install without touching a requirements file.
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - "Dockerfile"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - "Dockerfile"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "30 6 * * 1"   # Mondays 06:30 UTC, matching the in-stack beat job
  workflow_dispatch: {}

permissions:
  contents: read           # least privilege: the job only needs to read the repo

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — this job only reads the repo, so don't leave the
      # checkout token in .git/config where a later step could reuse it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install "pip-audit>=2.7,<3.0"
      - name: Audit pinned dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

  pip-audit-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Plain `docker build` rather than a build action: the runner already has Docker,
      # this needs no registry, no cache export and no credentials, and every action
      # added here is another supply-chain edge to pin and review.
      - name: Build the application image
        run: docker build --tag forca-command-grid:audit .
      - name: Audit the packages actually installed in the image
        # No `-r` flag. That is the whole point: pip-audit with no requirements file
        # audits the environment it is running in — every distribution in the image's
        # site-packages, at the version really installed. pip-audit is a runtime
        # dependency (requirements.txt), so it is already in there.
        #
        # --network none is not usable: the audit queries the advisory feed. It gets a
        # throwaway container with the repo's own image and nothing mounted.
        run: docker run --rm forca-command-grid:audit pip-audit --progress-spinner off

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # No setup-node and no `npm ci`. `npm audit` resolves the tree from the committed
      # package-lock.json alone (verified: it reports correctly with node_modules absent),
      # so this job never executes a single line of third-party install script — which is
      # the right posture for a job whose entire purpose is distrusting those packages.
      # The runner's preinstalled Node is used deliberately, matching ci.yml's
      # frontend-assets job; one less third-party action to pin and review.
      - name: Record the toolchain versions
        run: node --version && npm --version

      # Informational pass first so the full picture survives a red gate below, and so a
      # MODERATE that nobody has to act on today is still somewhere a human can see it.
      - name: Full report (informational — never fails)
        run: |
          set -euo pipefail
          {
            echo "## npm audit — frontend/ (full tree, all severities)"
            echo
            echo '```'
            npm audit 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------------
      # TWO GATES AT DIFFERENT THRESHOLDS. The asymmetry is the point, so here is why.
      #
      # `dependencies` (alpinejs, chart.js, htmx.org, svg-pan-zoom) are vendored into
      # static/js/vendor/ and served to every visitor's browser. A HIGH there is remote
      # code running in a director's session against attacker-controlled input. Failing
      # the build is proportionate.
      #
      # `devDependencies` is tailwindcss and its ~75 transitive build packages. None of it
      # ships: production has no Node, the deploy path never runs Tailwind, and the only
      # input the toolchain ever processes is this repo's own CSS and templates. A ReDoS
      # in a PostCSS parser cannot be reached by anyone who is not already committing to
      # this repo. Holding the build hostage to it would be the mistake this whole
      # workstream is a reaction to: the advisories are frequently unfixable without a
      # Tailwind major bump, so the gate would sit red for weeks, and a permanently red
      # gate does not get fixed — it gets deleted, taking the browser-facing check with it.
      #
      # So dev-only findings are reported, not gated — EXCEPT at CRITICAL, where the
      # realistic scenario stops being "sloppy regex" and starts being "this package was
      # taken over". A compromised build dependency runs with the committer's credentials
      # and writes the bytes we ship; that is worth stopping for even though nothing in it
      # reaches a browser.
      # ---------------------------------------------------------------------------
      - name: Gate — browser-shipped libraries, HIGH and above
        run: npm audit --omit=dev --audit-level=high

      - name: Gate — build-only toolchain, CRITICAL only
        run: npm audit --audit-level=critical
