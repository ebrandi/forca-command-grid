# Trivy suppressions — the pressure-release valve for the image scan.
#
# WHY THIS FILE EXISTS EVEN THOUGH IT IS EMPTY:
#   A gate that cannot be suppressed gets deleted. Sooner or later a fixable HIGH will
#   land that this project genuinely cannot action this week — an upstream base image
#   that has not rebuilt yet, a CVE in a code path the app never reaches — and at that
#   point somebody is going to make the red go away. The only question is whether they
#   do it by writing down a reason and a date here, or by deleting the job.
#
#   So: suppressions are allowed, but they must ROT LOUDLY. Every entry MUST carry
#   `expired_at`. When that date passes trivy stops honouring the entry and the finding
#   comes back, which forces a conscious re-decision instead of a permanent blind spot.
#   An undated suppression is indistinguishable from having no scanner at all — that is
#   the exact failure this whole workstream exists to correct (a Recommendation nobody
#   ever closed is not a control).
#
# RULES FOR ADDING AN ENTRY:
#   * `statement` says WHY, concretely — "not reachable: the app never invokes perl" is a
#     reason; "false positive" is not.
#   * `expired_at` is at most 90 days out. Shorter for anything network-reachable.
#   * Prefer fixing. Suppression is for buying time, never for closing the ticket.
#
# FORMAT: https://trivy.dev/latest/docs/configuration/filtering/#by-finding-ids
# Example (keep commented; this is a template, not an active suppression):
#
#   vulnerabilities:
#     - id: CVE-0000-00000
#       paths: ["usr/lib/x86_64-linux-gnu/libexample.so.1"]
#       statement: "Not reachable — the app never links libexample. Base image fix pending upstream."
#       expired_at: 2026-10-01

vulnerabilities:
  # Both of these are pip's own VENDORED dependency list, not packages this image
  # installs. Trivy reads /usr/local/lib/python3.12/site-packages/pip/_vendor/vendor.txt
  # and reports its contents as though they were installed distributions:
  #
  #     msgpack==1.1.2
  #     setuptools==70.3.0
  #
  # Verified inside the image rather than argued from the advisory text.

  - id: GHSA-6v7p-g79w-8964
    statement: >-
      pip's vendored copy of msgpack (pip/_vendor/msgpack, 1.1.2). The msgpack this
      application imports is 1.2.1 and is clean — `python -c "import msgpack"` reports
      (1, 2, 1). The vendored copy is used only by pip itself, to deserialise its own
      HTTP cache, at image-build time, over TLS from PyPI; it is not on the running
      application's import path. It cannot be bumped independently — it ships inside pip,
      and pip is already at the latest release (26.2). Revisit when pip re-vendors:
      if this has not cleared by the expiry, check for a newer pip first.
    expired_at: 2026-10-01

  - id: CVE-2025-47273
    statement: >-
      setuptools is NOT PRESENT in this image at all — this is a false positive from the
      same pip/_vendor/vendor.txt manifest. Verified: `import setuptools` raises
      ModuleNotFoundError, and there is no setuptools dist-info, egg-info or wheel
      anywhere on the filesystem. There is no code here to exploit and nothing to
      upgrade. Re-check at expiry in case trivy's python analyser stops treating that
      manifest as an install list, at which point this entry should simply be deleted.
    expired_at: 2026-10-01
