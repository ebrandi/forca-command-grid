# Automated dependency updates.
#
# The security workflow tells you a dependency is vulnerable; Dependabot opens the
# PR that fixes it. Both matter: pip-audit only fails CI when requirements.txt
# already names a vulnerable range, and requirements.txt uses lower bounds, so a
# newly-disclosed CVE in an installed package needs a floor bump to be enforced.
#
# `github-actions` is included because this repo pins actions to commit SHAs — a
# pinned SHA never picks up an upstream security fix on its own.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"

  # The four runtime libraries in frontend/package.json — alpinejs, chart.js, htmx.org
  # and svg-pan-zoom — are pinned to EXACT versions and vendored into static/js/vendor/,
  # which means they are served to every visitor's browser and will never move on their
  # own. Nothing was watching them: there was no npm ecosystem here and no `npm audit`
  # anywhere in CI, so the only postcss HIGH this project has seen was found by a human
  # running the command by hand. An exact pin is the right call for reproducible builds
  # (see scripts/check-frontend-build.sh) but it converts "we are up to date" from a
  # default into something that has to be maintained — this entry is that maintenance.
  #
  # `directory: /frontend` because package.json and package-lock.json live there, not at
  # the root. The lockfile is committed, so Dependabot can resolve the transitive tree
  # and open PRs for indirect packages too.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "deps"
    # Grouping keeps the four browser-shipped libraries in one reviewable PR. They share
    # a single gate — the committed vendor bundles must be rebuilt and re-committed for
    # any of them (ci.yml's frontend-assets job fails otherwise) — so splitting them into
    # four PRs would just mean doing that rebuild four times.
    groups:
      frontend-runtime:
        dependency-type: "production"
      frontend-build-tooling:
        dependency-type: "development"

  # NOTE: this does not reach the trivy version pinned in
  # .github/actions/install-trivy/action.yml — that is a checksum-verified release
  # tarball, not a `uses:`, so no bot will ever propose a bump. Bumping it is manual and
  # the action's header documents how. That is an accepted trade: an unverifiable SHA
  # would be worse than a pin someone has to touch by hand.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"

  # Covers the Dockerfile's own base image (python:3.12-slim). It does NOT cover the
  # images named in the compose files — see the docker-compose entry below.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "docker"

  # nginx, postgres and redis are pinned ONLY in docker-compose*.yml, which the `docker`
  # ecosystem above does not read — it scans Dockerfiles. Without this entry those three
  # images have no watcher at all, and a pinned tag that stops receiving upstream updates
  # degrades in complete silence: nothing fails, nothing warns, the digest simply stops
  # moving. That is precisely what happened to `nginx:1.27-alpine`, which sat frozen while
  # accumulating 37 HIGH/CRITICAL advisories including a CRITICAL in OpenSSL, and was found
  # only by a manual audit. A weekly PR is the cheapest way to notice the next one.
  #
  # Both compose files are picked up. Dependabot's compose file-matcher is
  #   /(docker-)?compose(-[\w]+)?(?>\.[\w-]+)?\.ya?ml/i
  # applied unanchored, so the optional dot-segment matches `docker-compose.prod.yml` —
  # which matters, because that is the ONLY file nginx is pinned in. Verified against the
  # regex rather than assumed; do not "simplify" the filename on the belief that only
  # `docker-compose.yml` is scanned.
  #
  # KNOW WHAT THIS DOES NOT DO: Dependabot proposes VERSION BUMPS. It cannot see a
  # vulnerability inside a tag you are already on, and a frozen tag has no newer version
  # to propose — which is exactly how nginx:1.27-alpine rotted in place. That gap is
  # covered by trivy (.github/workflows/image-scan.yml and scripts/scan-running-images.sh),
  # which reads the image's own package database. The two are complements, not substitutes:
  # this entry keeps us current, trivy tells us when current is not enough.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    # The parser emits a dependency for every `image:` value and does NOT skip services
    # that also declare `build:` — so without this it would try to resolve
    # `forca-command-grid`, which is built locally and exists in no registry. Nothing
    # breaks, but the update run carries a permanent unresolvable dependency, and noise
    # inside a security control is how people learn to stop reading it.
    ignore:
      - dependency-name: "forca-command-grid"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "docker"
